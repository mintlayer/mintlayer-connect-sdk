name: Publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        type: choice
        required: true
        options:
          - "@mintlayer/sdk"
          - "@mintlayer/react"
          - "@mintlayer/wasm-lib"
  push:
    tags:
      - "sdk-v*"
      - "react-v*"
      - "wasm-lib-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Derive package name from tag
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            sdk-v*)      echo "PKG=@mintlayer/sdk" >> "$GITHUB_ENV" ;;
            react-v*)    echo "PKG=@mintlayer/react" >> "$GITHUB_ENV" ;;
            wasm-lib-v*) echo "PKG=@mintlayer/wasm-lib" >> "$GITHUB_ENV" ;;
            *) echo "Unknown tag format: $TAG"; exit 1 ;;
          esac

      - name: Set package from dispatch input
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "PKG=${{ github.event.inputs.package }}" >> "$GITHUB_ENV"

      - name: Set package directory
        run: echo "PKG_DIR=packages/${PKG#*/}" >> "$GITHUB_ENV"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Install latest npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter "$PKG" build --if-present

      - name: Test
        run: pnpm --filter "$PKG" test --if-present

      - name: Replace workspace: dependencies with concrete versions
        shell: node {0}
        run: |
          const fs = require('fs');
          const path = 'packages/' + process.env.PKG.split('/')[1] + '/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          for (const section of ['dependencies', 'peerDependencies', 'devDependencies', 'optionalDependencies']) {
            const deps = pkg[section];
            if (!deps) continue;
            for (const [name, spec] of Object.entries(deps)) {
              if (typeof spec !== 'string' || !spec.startsWith('workspace:')) continue;
              const dep = JSON.parse(fs.readFileSync('packages/' + name.split('/')[1] + '/package.json', 'utf8'));
              const prefix = spec.slice('workspace:'.length);
              deps[name] = prefix === '*' ? '^' + dep.version : prefix.replace(/\*/, dep.version);
            }
          }
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          console.log('Resolved workspace deps for', process.env.PKG);

      - name: Stage publish
        working-directory: ${{ env.PKG_DIR }}
        run: npm stage publish --provenance
